name: Build and Release

on:
  workflow_dispatch:   # Manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JadeDbClient

      - name: Build
        run: dotnet build JadeDbClient --configuration Release --no-restore

      - name: Run tests
        run: dotnet test JadeDbClient --no-restore --verbosity normal

      - name: Pack NuGet package
        run: dotnet pack JadeDbClient --configuration Release --no-build -o ./nupkg

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          TOKEN="${MY_GITHUB_TOKEN:-$GITHUB_TOKEN}"
          dotnet nuget push ./nupkg/*.nupkg -s https://nuget.pkg.github.com/KaustavCodes/index.json -k "$TOKEN" --skip-duplicate

      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: KaustavCodes

      - name: Publish to NuGet.org (Trusted Publishing)
        run: dotnet nuget push ./nupkg/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --skip-duplicate
